        window.addEventListener('DOMContentLoaded', () => {

        function loadAndRenderDossier() {
            // โหลดข้อมูลจาก localStorage หรือ session
            let targetData = null;
            try {
                const stored = localStorage.getItem('siamhora_current_print_dossier');
                if (stored) {
                    targetData = JSON.parse(stored);
                }
            } catch (e) {}

            // ถ้าไม่มี ให้ดึง default สมมติ
            if (!targetData) {
                targetData = {
                    name: "เจ้าชะตา",
                    birthDate: "1990-08-15",
                    birthTime: "09:30",
                    province: "กรุงเทพมหานคร"
                };
            }

            // คำนวณดวงชะตา
            const horo = ThaiHoroProEngine.calculateFullHoroscope(targetData.birthDate, targetData.birthTime);
            const num = ThaiHoroProEngine.analyzePersonalLuckyElements(horo.birthPlanetNum, horo.asc.rasiIndex);
            const ritual = ThaiHoroProEngine.generateRitualPrescription(horo);
            const temples = ThaiHoroProEngine.getSacredTempleRecommendations(horo);
            const bYear = new Date(targetData.birthDate).getFullYear();
            const ageYang = ThaiHoroProEngine.calculateAgeYang(targetData.birthDate);
            const yearData = ThaiHoroProEngine.calculateSingleYearPrediction(horo.birthPlanetNum, ageYang, bYear);

            renderFourA4Pages(targetData, horo, num, ritual, temples, yearData, ageYang);
        }

            setTimeout(() => {
                renderWheelOnCanvas('p1RasiCanvas', data, false);
                renderWheelOnCanvas('p4NavamshaCanvas', data, true);

        }

        function renderWheelOnCanvas(canvasId, data, isNavamsha) {
            const canvas = document.getElementById(canvasId);
            if (!canvas || !data) return;
            const ctx = canvas.getContext('2d');
            const w = canvas.width, h = canvas.height;
            const cx = w/2, cy = h/2, r = (w/2) - 8;

            ctx.clearRect(0, 0, w, h);
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, w, h);

            // Rings
            ctx.strokeStyle = "#d4af37";
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(cx, cy, r * 0.81, 0, Math.PI * 2);
            ctx.strokeStyle = "#b45309";
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(cx, cy, r * 0.28, 0, Math.PI * 2);
            ctx.fillStyle = "#f8fafc";
            ctx.fill();
            ctx.strokeStyle = "#d4af37";
            ctx.lineWidth = 1.2;
            ctx.stroke();

            // 12 Sectors
            for (let i = 0; i < 12; i++) {
                const angle = (i * 30 - 90) * Math.PI / 180;
                const x1 = cx + (r * 0.28) * Math.cos(angle);
                const y1 = cy + (r * 0.28) * Math.sin(angle);
                const x2 = cx + r * Math.cos(angle);
                const y2 = cy + r * Math.sin(angle);
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.strokeStyle = "rgba(212, 175, 55, 0.45)";
                ctx.lineWidth = 1.2;
                ctx.stroke();
            }

            const rasiNames = ["เมษ", "พฤษภ", "มิถุน", "กรกฎ", "สิงห์", "กันย์", "ตุลย์", "พิจิก", "ธนู", "มังกร", "กุมภ์", "มีน"];
            ctx.font = "bold 13px Sarabun, sans-serif";
            ctx.fillStyle = "#1e1b4b";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            for (let i = 0; i < 12; i++) {
                const midAngle = ((i * 30) - 75) * Math.PI / 180;
                const rx = cx + (r * 0.90) * Math.cos(midAngle);
                const ry = cy + (r * 0.90) * Math.sin(midAngle);
                ctx.fillText(rasiNames[i], rx, ry);
            }

            ctx.font = "bold 13px Sarabun, sans-serif";
            ctx.fillStyle = "#78350f";
            if (!isNavamsha) {
                ctx.fillText(`${data.asc.deg}°`, cx, cy - 8);
                ctx.fillText(`${data.asc.min}'`, cx, cy + 9);
            } else {
                ctx.fillText("นวางค์", cx, cy - 8);
                ctx.fillText("ไส้ดวง", cx, cy + 9);
            }

            const planetsInRasi = {};
            for (let i = 0; i < 12; i++) planetsInRasi[i] = [];

            if (!isNavamsha) {
                planetsInRasi[data.asc.rasiIndex].push({ label: "ลั", color: "#dc2626" });
                for (let p in data.birthPlanets) {
                    const pl = data.birthPlanets[p];
                    const isBenefic = (p === "2" || p === "4" || p === "5" || p === "6");
                    planetsInRasi[pl.rasi].push({ label: pl.thNum, color: isBenefic ? "#059669" : "#1e40af" });
                }
            } else {
                const navAscRasi = data.reading?.basicSummary?.navamshaAsc;
                const navAscIdx = rasiNames.indexOf(navAscRasi);
                if (navAscIdx !== -1) planetsInRasi[navAscIdx].push({ label: "ลั", color: "#dc2626" });
                for (let p in data.birthPlanets) {
                    const pl = data.birthPlanets[p];
                    const navRasiName = pl.navamsha ? (pl.navamsha.rasiName || pl.navamsha) : null;
                    const navIdx = navRasiName ? rasiNames.indexOf(navRasiName) : pl.rasi;
                    if (navIdx !== -1) {
                        const isBenefic = (p === "2" || p === "4" || p === "5" || p === "6");
                        planetsInRasi[navIdx].push({ label: pl.thNum, color: isBenefic ? "#059669" : "#1e40af" });
                    }
                }
            }

            for (let i = 0; i < 12; i++) {
                const list = planetsInRasi[i];
                if (!list.length) continue;
                const midAngle = ((i * 30) - 75) * Math.PI / 180;
                list.forEach((item, pIdx) => {
                    const distRatio = 0.42 + (pIdx * 0.17);
                    const px = cx + (r * distRatio) * Math.cos(midAngle);
                    const py = cy + (r * distRatio) * Math.sin(midAngle);
                    ctx.font = item.label === "ลั" ? "bold 19px Sarabun" : "bold 17px Sarabun";
                    ctx.fillStyle = item.color;
                    ctx.fillText(item.label, px, py);
                });
            }
        }
    </script>
</body>
</html>
