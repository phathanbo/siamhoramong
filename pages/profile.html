    <!-- Standalone Profile Auto-Load Script -->
    <script charset="UTF-8">
        function loadAllAvailableProfiles() {
            const list = [];
            const idSet = new Set();

            const addProf = (m) => {
                if (!m) return;
                const key = m.memberId || m.id || (m.name ? `${m.name}_${m.birthdate}` : null);
                if (key && !idSet.has(String(key))) {
                    idSet.add(String(key));
                    list.push(m);
                }
            };

            // 1. horo_history
            try {
                const history = JSON.parse(localStorage.getItem('horo_history')) || [];
                history.forEach(addProf);
            } catch(e) {}

            // 2. thaiHoroProfile
            try {
                const p = JSON.parse(localStorage.getItem('thaiHoroProfile'));
                addProf(p);
            } catch(e) {}

            // 3. Auth session
            try {
                const sess = JSON.parse(localStorage.getItem('siamhora_auth_session'));
                if (sess && (sess.name || sess.username) && sess.birthdate) {
                    addProf({
                        memberId: sess.memberId || 'MEM-001',
                        name: sess.name || sess.displayName || sess.username,
                        lastName: sess.lastName || '',
                        birthdate: sess.birthdate,
                        birthtime: sess.birthtime || '12:00',
                        zodiac: sess.zodiac || 'ชวด',
                        province: sess.province || 'กรุงเทพมหานคร',
                        role: sess.role || 'user'
                    });
                }
            } catch(e) {}

            // 4. Default / Sample Demo Profiles so user can test and switch multiple members
            const defaultProfiles = [
                {
                    memberId: "20260705001",
                    name: "พิกุรห์",
                    lastName: "บุญเพ็ชร์",
                    birthdate: "02/03/1995",
                    birthtime: "14:26",
                    zodiac: "ชวด",
                    province: "กรุงเทพมหานคร",
                    role: "user"
                },
                {
                    memberId: "20260705002",
                    name: "สมชาย",
                    lastName: "มั่นคง",
                    birthdate: "15/08/1988",
                    birthtime: "08:30",
                    zodiac: "มะโรง",
                    province: "เชียงใหม่",
                    role: "user"
                },
                {
                    memberId: "20260705003",
                    name: "ศิริพร",
                    lastName: "เจริญสุข",
                    birthdate: "24/12/2000",
                    birthtime: "19:15",
                    zodiac: "มะเส็ง",
                    province: "นนทบุรี",
                    role: "user"
                }
            ];

            defaultProfiles.forEach(addProf);

            return list;
        }

        window.loadAllAvailableProfiles = loadAllAvailableProfiles;

        function initStandaloneProfile() {
            try {
                const profiles = loadAllAvailableProfiles();
                const select = document.getElementById('profileMemberSelect');
                if (select) {
                    select.innerHTML = '<option value="">-- เลือกสมาชิกเพื่อดูแผ่นดวง --</option>';
                    profiles.forEach((m, idx) => {
                        const opt = document.createElement('option');
                        const valKey = m.memberId || m.id || m.birthdate || String(idx);
                        opt.value = valKey;
                        opt.textContent = `${m.memberId ? `[${m.memberId}] ` : ''}${m.name || 'สมาชิก'} ${m.lastName || ''} (${m.birthdate || ''})`;
                        select.appendChild(opt);
                    });
                }

                // Check for URL Query Param ?id=... or ?memberId=...
                const urlParams = new URLSearchParams(window.location.search);
                const targetId = urlParams.get('id') || urlParams.get('memberId');

                let targetMember = null;
                if (targetId && profiles.length > 0) {
                    targetMember = profiles.find(m => String(m.memberId) === String(targetId) || String(m.id) === String(targetId));
                }

                if (!targetMember && profiles.length > 0) {
                    targetMember = profiles[0];
                }

                if (targetMember && typeof showProfilePage === 'function') {
                    showProfilePage(targetMember);
                    if (select && (targetMember.memberId || targetMember.id)) {
                        select.value = targetMember.memberId || targetMember.id;
                    }
                }
            } catch (e) {
                console.error("Error initializing standalone profile:", e);
            }
        }

        function onSelectMemberProfile(val) {
            if (!val) return;
            const profiles = loadAllAvailableProfiles();
            let found = profiles.find(m => String(m.memberId) === String(val) || String(m.id) === String(val) || String(m.birthdate) === String(val));
            if (!found && !isNaN(val)) {
                found = profiles[parseInt(val, 10)];
            }
            if (found && typeof showProfilePage === 'function') {
                showProfilePage(found);
                // Update URL query string
                const newUrl = window.location.pathname + '?id=' + encodeURIComponent(found.memberId || found.id || val);
                window.history.pushState({ path: newUrl }, '', newUrl);
            }
        }

        window.initStandaloneProfile = initStandaloneProfile;
        window.onSelectMemberProfile = onSelectMemberProfile;

        // Run auto-loader on DOM ready and after module script initializes
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(initStandaloneProfile, 200);
        });
    </script>
