<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สร้างรายงานดวงชะตาชีวิตตลอดชีพ - สยามโหรามงคล</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script charset="UTF-8" src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        body { 
            margin: 0; 
            background: linear-gradient(135deg, #0d0b21, #1b1737, #131124); 
            color: #fff; 
            font-family: 'Sarabun', sans-serif; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
        }
        .header { 
            background: rgba(13, 11, 33, 0.85); 
            backdrop-filter: blur(10px);
            padding: 20px 40px; 
            border-bottom: 1px solid rgba(212, 175, 55, 0.3); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 4px 30px rgba(0,0,0,0.5); 
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header h1 { 
            margin: 0; 
            color: #FFDF73; 
            font-size: 26px; 
            text-shadow: 0 0 15px rgba(212,175,55,0.4); 
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .header h1 i { color: #d4af37; }
        .back-btn { 
            background: rgba(255, 255, 255, 0.05); 
            color: #FFDF73; 
            border: 1px solid rgba(212, 175, 55, 0.3); 
            padding: 10px 25px; 
            border-radius: 50px; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            text-decoration: none; 
            display: inline-flex; 
            align-items: center; 
            gap: 8px; 
            font-size: 16px; 
        }
        .back-btn:hover { 
            background: rgba(212, 175, 55, 0.15); 
            border-color: #d4af37; 
            box-shadow: 0 0 15px rgba(212,175,55,0.2);
            transform: translateY(-2px);
        }
        .content { 
            display: flex; 
            flex: 1; 
            padding: 30px 40px; 
            gap: 40px; 
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }
        .sidebar { 
            flex: 0 0 400px; 
            background: rgba(20, 15, 35, 0.7); 
            backdrop-filter: blur(15px);
            border: 1px solid rgba(212, 175, 55, 0.25); 
            border-radius: 20px; 
            padding: 30px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.6); 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            height: fit-content;
        }
        .sidebar-title {
            color: #FFF;
            margin: 0;
            font-size: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .sidebar-title i { color: #d4af37; }
        .form-group { 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            background: rgba(255, 255, 255, 0.02); 
            padding: 15px; 
            border-radius: 12px; 
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.3s;
        }
        .form-group:hover {
            border-color: rgba(212, 175, 55, 0.3);
            background: rgba(212, 175, 55, 0.02);
        }
        .form-group label { 
            color: #FFDF73; 
            font-weight: 500; 
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .form-group select, .form-group input { 
            padding: 10px 14px; 
            border-radius: 8px; 
            border: 1px solid rgba(212, 175, 55, 0.3); 
            background: rgba(0, 0, 0, 0.4); 
            color: #fff; 
            font-family: 'Sarabun'; 
            font-size: 15px;
            transition: all 0.3s;
        }
        .form-group select:focus, .form-group input:focus { 
            outline: none; 
            border-color: #d4af37; 
            box-shadow: 0 0 0 2px rgba(212,175,55,0.2);
        }
        .btn-generate { 
            background: linear-gradient(135deg, #d4af37, #f39c12); 
            color: #111; 
            font-weight: 700; 
            font-size: 18px; 
            padding: 18px; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            margin-top: 10px; 
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 20px rgba(212,175,55,0.3);
        }
        .btn-generate:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 15px 30px rgba(212,175,55,0.5); 
            background: linear-gradient(135deg, #f9e596, #d4af37);
        }
        .btn-generate:active {
            transform: translateY(0);
        }
        .preview-area { 
            flex: 1; 
            background: rgba(0, 0, 0, 0.35); 
            border: 1px dashed rgba(212, 175, 55, 0.3);
            border-radius: 20px; 
            padding: 30px; 
            display: flex; 
            justify-content: center; 
            overflow-y: auto; 
            align-items: flex-start; 
            position: relative;
            min-height: 70vh;
        }
        .preview-placeholder {
            color: rgba(255,255,255,0.4); 
            text-align: center; 
            margin-top: 15vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .preview-placeholder i {
            font-size: 80px; 
            color: rgba(212, 175, 55, 0.2);
        }
        .preview-placeholder h3 {
            margin: 0;
            font-weight: 400;
            font-size: 24px;
        }
        
        /* Print Stylesheet integration */
        @media print {
            body { background: #fff !important; color: #000 !important; }
            .header, .sidebar, #lifetimePdfPreviewNav { display: none !important; }
            .content { padding: 0 !important; margin: 0 !important; display: block !important; }
            .preview-area { border: none !important; padding: 0 !important; margin: 0 !important; background: transparent !important; display: block !important; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1><i class="fas fa-file-pdf"></i> ออกรายงานดวงชะตาชีวิตตลอดชีพ (Lifetime PDF)</h1>
        <a href="../admin.html" class="back-btn"><i class="fas fa-arrow-left"></i> กลับไประบบหลังบ้าน</a>
    </div>

    <div class="content">
        <div class="sidebar">
            <h3 class="sidebar-title"><i class="fas fa-sliders-h"></i> ข้อมูลเจ้าชะตา</h3>
            
            <div class="form-group">
                <label><i class="fas fa-user-circle"></i> เลือกชื่อลูกค้าจากฐานข้อมูล:</label>
                <select id="vipMemberSelect" class="member-selector-shared" onchange="window.autoFillLifetimeMember(this.value)">
                    <option value="">-- โหลดข้อมูลลูกค้า --</option>
                </select>
            </div>
            
            <div class="form-group">
                <label><i class="fas fa-user"></i> ชื่อ-นามสกุล:</label>
                <input type="text" id="ltName" placeholder="ชื่อ นามสกุล">
            </div>

            <div class="form-group">
                <label><i class="fas fa-venus-mars"></i> เพศ:</label>
                <select id="ltSex">
                    <option value="male">ชาย</option>
                    <option value="female">หญิง</option>
                </select>
            </div>

            <div class="form-group">
                <label><i class="fas fa-calendar-day"></i> วันเกิด:</label>
                <input type="date" id="ltDobDate">
            </div>

            <div class="form-group">
                <label><i class="fas fa-clock"></i> เวลาเกิด:</label>
                <input type="time" id="ltDobTime" value="12:00">
            </div>

            <div class="form-group">
                <label><i class="fas fa-map-marker-alt"></i> สถานที่เกิด / จังหวัด:</label>
                <input type="text" id="ltLocation" placeholder="เช่น กรุงเทพมหานคร">
            </div>
            
            <button class="btn-generate" onclick="generateLifetimeReport()"><i class="fas fa-magic"></i> สร้างรายงานตลอดชีพ</button>
        </div>
        
        <div class="preview-area" id="previewArea">
            <div class="preview-placeholder">
                <i class="fas fa-file-invoice"></i>
                <h3>ยังไม่ได้สร้างรายงานดวงชะตาชีวิต</h3>
                <p>กรอกข้อมูลผู้ใช้ หรือเลือกข้อมูลลูกค้าจากระบบ และกดปุ่ม "สร้างรายงานตลอดชีพ" เพื่อดูตัวอย่าง</p>
            </div>
        </div>
    </div>

    <!-- Load Astronomy Engine CDN (Essential for thai-hora.js) -->
    <script charset="UTF-8" src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>

    <!-- Core astrology calculation engine scripts -->
    <script charset="UTF-8" src="../src/data/ayanamsa-data.js"></script>
    <script charset="UTF-8" src="../src/data/thai-astrology-data.js"></script>
    <script charset="UTF-8" src="../src/data/day-birth-data.js"></script>
    <script charset="UTF-8" src="../src/engine/thai-lunar.js"></script>
    <script charset="UTF-8" src="../src/engine/element.js"></script>
    <script charset="UTF-8" src="../src/engine/seven-digits.js"></script>
    <script charset="UTF-8" src="../src/engine/business-fortune.js"></script>
    <script charset="UTF-8" src="../src/engine/year-clash.js"></script>
    <script charset="UTF-8" src="../src/engine/auspicious-days.js"></script>
    <script charset="UTF-8" src="../src/engine/ascendant.js"></script>
    <script charset="UTF-8" src="../src/engine/horoscope-seven.js"></script>
    <script charset="UTF-8" src="../src/engine/promchart.js"></script>
    <script charset="UTF-8" src="../src/ui/zodiac-tab-switcher.js"></script>
    <script charset="UTF-8" src="../src/engine/soulmate-direction.js"></script>
    <script charset="UTF-8" src="../src/data/chant-data.js"></script>
    <script charset="UTF-8" src="../src/engine/ubakong.js"></script>
    <script charset="UTF-8" src="../src/engine/compatibility.js"></script>
    <script charset="UTF-8" src="../src/engine/life-extension.js"></script>
    <script charset="UTF-8" src="../src/engine/name-analysis.js"></script>
    <script charset="UTF-8" src="../src/engine/thai-hora.js"></script>

    <!-- Database and member management sync -->
    <script charset="UTF-8" src="../src/utils/utils-helpers.js"></script>
    <script charset="UTF-8" type="module" src="../src/ui/membermanager.js"></script>

    <!-- Script that handles PDF/HTML generation logic -->
    <script charset="UTF-8" src="../admin/js/admin-lifetime-report.js"></script>
</body>
</html>
