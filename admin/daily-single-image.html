<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สร้างภาพดวงรายวัน (แผ่นเดียว) - สยามโหรามงคล</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 -->
    <script charset="UTF-8" src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        body { 
            margin: 0; 
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); 
            color: #fff; 
            font-family: 'Sarabun', sans-serif; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
        }
        .header { 
            background: rgba(15, 12, 41, 0.8); 
            backdrop-filter: blur(10px);
            padding: 20px 40px; 
            border-bottom: 1px solid rgba(212, 175, 55, 0.3); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 4px 30px rgba(0,0,0,0.5); 
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header h1 { 
            margin: 0; 
            color: #FFDF73; 
            font-size: 26px; 
            text-shadow: 0 0 15px rgba(212,175,55,0.4); 
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .header h1 i { color: #d4af37; }
        .back-btn { 
            background: rgba(255, 255, 255, 0.05); 
            color: #FFDF73; 
            border: 1px solid rgba(212, 175, 55, 0.3); 
            padding: 10px 25px; 
            border-radius: 50px; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            text-decoration: none; 
            display: inline-flex; 
            align-items: center; 
            gap: 8px; 
            font-size: 16px; 
        }
        .back-btn:hover { 
            background: rgba(212, 175, 55, 0.15); 
            border-color: #d4af37; 
            box-shadow: 0 0 15px rgba(212,175,55,0.2);
            transform: translateY(-2px);
        }
        .content { 
            display: flex; 
            flex: 1; 
            padding: 30px 40px; 
            gap: 40px; 
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }
        .sidebar { 
            flex: 0 0 400px; 
            background: rgba(20, 15, 35, 0.6); 
            backdrop-filter: blur(15px);
            border: 1px solid rgba(212, 175, 55, 0.2); 
            border-radius: 20px; 
            padding: 35px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); 
            display: flex; 
            flex-direction: column; 
            gap: 25px; 
            height: fit-content;
        }
        .sidebar-title {
            color: #FFF;
            margin: 0;
            font-size: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .sidebar-title i { color: #d4af37; }
        .form-group { 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            background: rgba(255, 255, 255, 0.03); 
            padding: 20px; 
            border-radius: 12px; 
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s;
        }
        .form-group:hover {
            border-color: rgba(212, 175, 55, 0.3);
            background: rgba(212, 175, 55, 0.02);
        }
        .form-group label { 
            color: #FFDF73; 
            font-weight: 500; 
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .form-group select, .form-group input { 
            padding: 14px; 
            border-radius: 8px; 
            border: 1px solid rgba(212, 175, 55, 0.3); 
            background: rgba(0, 0, 0, 0.4); 
            color: #fff; 
            font-family: 'Sarabun'; 
            font-size: 16px;
            transition: all 0.3s;
            cursor: pointer;
        }
        .form-group select:focus, .form-group input:focus { 
            outline: none; 
            border-color: #d4af37; 
            box-shadow: 0 0 0 2px rgba(212,175,55,0.2);
        }
        .form-group option {
            background: #1a1a2e;
            color: #fff;
        }
        .btn-generate { 
            background: linear-gradient(135deg, #d4af37, #f39c12); 
            color: #111; 
            font-weight: 700; 
            font-size: 18px; 
            padding: 18px; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            margin-top: 10px; 
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 20px rgba(212,175,55,0.3);
        }
        .btn-generate:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 15px 30px rgba(212,175,55,0.5); 
            background: linear-gradient(135deg, #f9e596, #d4af37);
        }
        .btn-generate:active {
            transform: translateY(0);
        }
        .preview-area { 
            flex: 1; 
            background: rgba(0, 0, 0, 0.3); 
            border: 1px dashed rgba(212, 175, 55, 0.3);
            border-radius: 20px; 
            padding: 40px; 
            display: flex; 
            flex-direction: column;
            overflow-y: auto; 
            align-items: center; 
            position: relative;
        }
        #wfPreviewArea {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 580px;
        }
        /* Custom loader indicator style */
        .preview-loader {
            display: none;
            color: #FFDF73;
            padding: 40px;
            text-align: center;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1><i class="fas fa-image"></i> ระบบสร้างภาพดวงรายวัน (แผ่นเดียว)</h1>
        <a href="admin-console.html" class="back-btn"><i class="fas fa-arrow-left"></i> กลับไประบบหลังบ้าน</a>
    </div>

    <div class="content">
        <div class="sidebar">
            <h3 class="sidebar-title"><i class="fas fa-sliders-h"></i> ตั้งค่าการออกดวง</h3>
            
            <div class="form-group">
                <label>📅 เลือกวันที่:</label>
                <input type="date" id="wfDate" onchange="renderWeeklyFortunePreview()">
            </div>
            
            <div class="form-group">
                <label>✨ รูปแบบวันมงคลสูงสุด (ซ้ายบน):</label>
                <select id="wfBestDay" onchange="renderWeeklyFortunePreview()">
                    <option value="auto">คำนวณอัตโนมัติ (ธงชัย/อธิบดี)</option>
                    <option value="sun">วันอาทิตย์</option>
                    <option value="mon">วันจันทร์</option>
                    <option value="tue">วันอังคาร</option>
                    <option value="wed">วันพุธ</option>
                    <option value="thu">วันพฤหัสบดี</option>
                    <option value="fri">วันศุกร์</option>
                    <option value="sat">วันเสาร์</option>
                </select>
            </div>

            <div class="form-group">
                <label>⚠️ วันที่ต้องระวัง (ขวาบน):</label>
                <select id="wfBadDay" onchange="renderWeeklyFortunePreview()">
                    <option value="auto">คำนวณอัตโนมัติ (อุบาทว์/โลกาวินาศ)</option>
                    <option value="sun">วันอาทิตย์</option>
                    <option value="mon">วันจันทร์</option>
                    <option value="tue">วันอังคาร</option>
                    <option value="wed">วันพุธ</option>
                    <option value="thu">วันพฤหัสบดี</option>
                    <option value="fri">วันศุกร์</option>
                    <option value="sat">วันเสาร์</option>
                </select>
            </div>

            <div class="form-group">
                <label>🎨 สไตล์พื้นหลัง / ธีมภาพ:</label>
                <select id="wfTheme" onchange="renderWeeklyFortunePreview()">
                    <option value="royal">✨ สยามมงคลคลาสสิก (Royal Gold & Deep Purple)</option>
                    <option value="astronomy">🌌 ท้องฟ้าดวงดาว & จักรราศี (Mystic Cosmos)</option>
                    <option value="modern_dark">🌑 มินิมอลดาร์กทอง (Luxury Obsidian)</option>
                    <option value="light">☀️ สว่างละมุนหรูหรา (Ivory Gold Light)</option>
                </select>
            </div>
            
            <button class="btn-generate" onclick="downloadWeeklyFortuneImage()">
                <i class="fas fa-download"></i> ดาวน์โหลดภาพดวง (PNG)
            </button>
        </div>
        
        <div class="preview-area" id="previewArea">
            <div class="preview-loader" id="previewLoader">
                <i class="fas fa-spinner fa-spin fa-2x" style="margin-bottom: 10px;"></i>
                <p>กำลังสร้างตัวอย่างภาพดวง...</p>
            </div>
            <div id="wfPreviewArea">
                <!-- Template will be drawn here -->
            </div>
        </div>
    </div>

    <!-- Core astrologic and canvas helper scripts -->
    <script charset="UTF-8" src="../src/utils/utils-helpers.js"></script>
    <script charset="UTF-8" src="../src/engine/ascendant.js"></script>
    <script charset="UTF-8" src="../src/data/thai-astrology-data.js"></script>
    <script charset="UTF-8" src="../src/engine/thai-astrology-calculator.js"></script>
    <script charset="UTF-8" src="../src/engine/auspicious-days.js"></script>
    <script charset="UTF-8" src="../src/utils/colors.js"></script>
    <script charset="UTF-8" src="../src/data/fortune-daily-data.js"></script>
    <script charset="UTF-8" src="../src/engine/thai-horoscope-engine.js"></script>
    <script charset="UTF-8" src="../src/utils/canvas-helpers.js"></script>
    <script charset="UTF-8" src="js/admin-weekly-fortune.js"></script>
    <script>
        function resizeCapturePreview() {
            const previewEl = document.getElementById('wfPreviewArea');
            const captureArea = document.getElementById('wfCaptureArea');
            const previewArea = document.getElementById('previewArea');
            if (!captureArea || !previewArea || !previewEl) return;

            const availableWidth = previewArea.clientWidth - 80;
            const availableHeight = window.innerHeight - 200;
            
            const scaleX = Math.min(1, Math.max(0.4, availableWidth / 1200));
            const scaleY = Math.min(1, Math.max(0.4, availableHeight / 800));
            const scale = Math.min(scaleX, scaleY);

            captureArea.style.transformOrigin = 'top center';
            captureArea.style.transform = `scale(${scale})`;
            previewEl.style.height = `${800 * scale + 20}px`;
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Set default date to today
            const dateInput = document.getElementById('wfDate');
            if (dateInput) {
                dateInput.value = new Date().toISOString().split('T')[0];
            }
            
            // Rewrite functions to handle embedded preview inside the page directly instead of modal
            window.closeWeeklyFortuneModal = function() {};
            
            // Render on start
            if (typeof renderWeeklyFortunePreview === 'function') {
                setTimeout(() => {
                    renderWeeklyFortunePreview();
                    resizeCapturePreview();
                }, 100);
            }

            window.addEventListener('resize', resizeCapturePreview);
        });
    </script>
</body>
</html>
